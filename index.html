<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto de Base de Datos</title>
<style>
body{font-family:Arial;background:#edf4ff;color:#203047;margin:0;padding:20px;display:grid;place-items:center;min-height:100vh}.card{background:white;max-width:760px;width:100%;padding:28px;border-radius:20px;box-shadow:0 8px 30px #18365a22}header{text-align:center;background:#173b69;color:white;padding:22px;border-radius:14px}h1{margin:0 0 8px}.meta{display:flex;justify-content:space-between;margin:22px 0 10px;color:#173b69;font-weight:bold}.bar{height:9px;background:#e5ebf3;border-radius:9px;overflow:hidden}.fill{height:100%;background:#239b62;width:0}.tag{display:inline-block;background:#eaf3ff;color:#173b69;border-radius:20px;padding:7px 12px;margin-top:22px;font-size:13px;font-weight:bold}.q{font-size:24px;line-height:1.5;font-weight:bold;margin:16px 0}.blank{color:#bb7900;border-bottom:3px solid #e9ae39}input{width:100%;padding:14px;font-size:18px;border:2px solid #cbd6e4;border-radius:10px;box-sizing:border-box}button{padding:13px 18px;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin:14px 8px 0 0}.primary{background:#173b69;color:white}.secondary{background:#e8eef6;color:#173b69}button:disabled{opacity:.45}.feedback{padding:14px;border-radius:10px;margin-top:16px;display:none;line-height:1.4}.good{display:block;background:#e5f6ec;color:#12653a}.bad{display:block;background:#fff0ed;color:#9d2d20}.hint{color:#68788d;font-size:13px}#result{display:none;text-align:center}#result strong{font-size:44px;color:#198754}
</style>
<div class="card"><header><h1>🧠 Reto de Base de Datos</h1>Completa la palabra o frase y demuestra lo que sabes</header>
<section id="game"><div class="meta"><span id="count"></span><span id="score"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="tag" id="cat"></div><div class="q" id="question"></div><input id="answer" placeholder="Escribe tu respuesta"><br><button class="primary" id="check">Comprobar</button><button class="secondary" id="next" disabled>Siguiente →</button><div id="feedback" class="feedback"></div><p class="hint">Escribe solamente la palabra o expresión que completa la oración. Presiona Enter para comprobar.</p></section>
<section id="result"><h2>¡Reto terminado!</h2><strong id="final"></strong><p id="msg"></p><button class="primary" onclick="restart()">Volver a jugar</button></section></div>
<script>
const data=[
["Tablas y registros","Una ________ permite organizar información relacionada en una base de datos.",["tabla"],"La tabla organiza los datos en filas y columnas."],
["Tablas y registros","En una tabla, las ________ representan las características o atributos de los datos.",["columnas"],"Las columnas contienen los campos."],
["Tablas y registros","Cada fila de una tabla representa un ________.",["registro"],"Un registro reúne los datos de una persona, objeto o elemento."],
["Tablas y registros","Nombre, apellido y teléfono son ejemplos de ________.",["campos","campo"],"Los campos describen los datos que se almacenan."],
["Tipos de datos","En SQL Server, ________ se utiliza para almacenar números enteros.",["int"],"INT almacena números enteros."],
["Tipos de datos","________(50) permite guardar texto variable de hasta 50 caracteres.",["varchar","varchar(50)"],"VARCHAR(n) almacena texto de longitud variable."],
["Tipos de datos","Para almacenar una fecha de nacimiento se utiliza el tipo ________.",["date"],"DATE almacena fechas."],
["Tipos de datos","Para guardar números con decimales, como 125.50, se utiliza ________.",["decimal","numeric"],"DECIMAL almacena números con precisión decimal."],
["Claves","La clave ________ identifica de manera única cada registro.",["primaria","clave primaria","primary key"],"La clave primaria no se repite ni admite NULL."],
["Claves","La clave ________ relaciona una tabla con la clave primaria de otra.",["foranea","foránea","clave foranea","clave foránea","foreign key"],"La clave foránea establece relaciones entre tablas."],
["Claves","En Estudiantes, id_estudiante puede ser la clave ________.",["primaria"],"El identificador distingue cada estudiante."],
["Aplicación","Al agregar un estudiante nuevo, se agrega una nueva ________.",["fila","registro"],"El estudiante se almacena como un registro o fila."]
];
let i=0,points=0,done=false;const el=id=>document.getElementById(id);
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ")}
function show(){done=false;let d=data[i];el("count").textContent=`Pregunta ${i+1} de ${data.length}`;el("score").textContent=`Puntos: ${points}`;el("fill").style.width=(i/data.length*100)+"%";el("cat").textContent=d[0];el("question").innerHTML=d[1].replace("________",'<span class="blank">________</span>');el("answer").value="";el("answer").disabled=false;el("check").disabled=false;el("next").disabled=true;el("next").textContent=i===data.length-1?"Ver resultado":"Siguiente →";el("feedback").className="feedback";el("feedback").style.display="none";el("answer").focus()}
function check(){if(done)return;let v=norm(el("answer").value);if(!v){el("feedback").textContent="Escribe una respuesta primero.";el("feedback").className="feedback bad";return}done=true;let d=data[i],ok=d[2].map(norm).includes(v);if(ok){points++;el("feedback").innerHTML="¡Correcto! "+d[3];el("feedback").className="feedback good"}else{el("feedback").innerHTML="Respuesta esperada: <b>"+d[2][0]+"</b>. "+d[3];el("feedback").className="feedback bad"}el("feedback").style.display="block";el("score").textContent="Puntos: "+points;el("answer").disabled=true;el("check").disabled=true;el("next").disabled=false}
function next(){if(i<data.length-1){i++;show()}else{el("game").style.display="none";el("result").style.display="block";el("final").textContent=points+"/"+data.length;el("msg").textContent=points>=10?"¡Excelente!":points>=7?"¡Buen trabajo! Repasa los conceptos que fallaste.":"Sigue practicando; cada intento ayuda a aprender."}}
function restart(){i=0;points=0;el("result").style.display="none";el("game").style.display="block";show()}
el("check").onclick=check;el("next").onclick=next;el("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){if(!el("check").disabled)check();else if(!el("next").disabled)next()}});show();
</script></html>
